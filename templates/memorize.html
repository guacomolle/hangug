{% extends 'base.html' %}
{% block title %}Запоминание — Hangugo Words{% endblock %}
{% block content %}
{% include '_progress.html' %}

<div class="flashcard mx-auto mb-4" onclick="this.classList.toggle('flipped')">
  <div class="flashcard-inner">
    <div class="flashcard-face flashcard-front">
      <span class="fs-2 fw-bold">{{ word.korean }}</span>
      <small class="text-secondary mt-2">нажмите, чтобы увидеть перевод</small>
    </div>
    <div class="flashcard-face flashcard-back">
      <span class="fs-2 fw-bold">{{ word.russian }}</span>
    </div>
  </div>
</div>

<div class="d-flex justify-content-center gap-2 flex-wrap">
  <form method="post" action="{{ url_for('main.session_memorize_back') }}">
    <button type="submit" class="btn btn-outline-secondary" {{ 'disabled' if not has_history }}>
      <i class="bi bi-arrow-left me-1"></i>Назад
    </button>
  </form>
  <form method="post" action="{{ url_for('main.session_memorize_star') }}">
    <button type="submit" class="btn btn-outline-warning">
      <i class="bi {{ 'bi-star-fill' if hard else 'bi-star' }} me-1"></i>{{ 'Сложное' if hard else 'Отметить сложным' }}
    </button>
  </form>
  <form method="post" action="{{ url_for('main.session_memorize_skip') }}">
    <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-skip-forward me-1"></i>Пропустить</button>
  </form>
  <form method="post" action="{{ url_for('main.session_memorize_next') }}">
    <button type="submit" class="btn btn-primary"><i class="bi bi-arrow-right me-1"></i>Следующая карточка</button>
  </form>
</div>
{% endblock %}
