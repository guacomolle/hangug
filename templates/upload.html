{% extends 'base.html' %}
{% block title %}Загрузка файла — Hangugo Words{% endblock %}
{% block content %}
<div class="mb-3">
  <a href="{{ url_for('main.index') }}" class="text-secondary text-decoration-none"><i class="bi bi-arrow-left"></i> На главную</a>
</div>
<div class="card bg-dark border-secondary mx-auto" style="max-width: 480px;">
  <div class="card-body">
    <h1 class="h4 card-title mb-3">Загрузить новый файл</h1>
    <p class="text-secondary small">
      Поддерживаемые форматы: .docx, .xlsx, .csv. Файл должен содержать два столбца:
      корейское слово и перевод на русский.
    </p>
    <form method="post" enctype="multipart/form-data">
      <div class="mb-3">
        <input class="form-control" type="file" name="file" accept=".docx,.xlsx,.csv" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-upload me-1"></i>Загрузить
      </button>
    </form>
  </div>
</div>
{% endblock %}
