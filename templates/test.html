{% extends 'base.html' %}
{% block title %}Тестирование — Hangugo Words{% endblock %}
{% block content %}
<div id="progress-wrap">{% include '_progress.html' %}</div>

<div class="text-end mb-3">
  <div class="btn-group btn-group-sm" role="group" aria-label="Направление теста">
    <button type="button" class="btn btn-outline-secondary" id="dir-kr-ru">KR &rarr; RU</button>
    <button type="button" class="btn btn-outline-secondary" id="dir-ru-kr">RU &rarr; KR</button>
  </div>
  <div class="form-text">Переключение направления вступит в силу со следующего слова</div>
</div>

<div class="card bg-dark border-secondary mx-auto mb-4" style="max-width: 520px;">
  <div class="card-body text-center">
    <p class="fs-3 fw-bold mb-4" id="prompt">Загрузка...</p>
    <div id="options" class="d-grid gap-2"></div>
    <div id="feedback" class="mt-3 fw-semibold"></div>
  </div>
</div>

<div class="d-flex justify-content-center gap-2">
  <button class="btn btn-outline-secondary" id="skip-btn"><i class="bi bi-skip-forward me-1"></i>Пропустить</button>
  <button class="btn btn-primary d-none" id="next-btn">Далее <i class="bi bi-arrow-right ms-1"></i></button>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/quiz.js') }}"></script>
<script>
  initQuiz({
    questionUrl: "{{ url_for('main.api_question') }}",
    answerUrl: "{{ url_for('main.api_answer') }}",
    skipUrl: "{{ url_for('main.api_skip') }}",
    directionUrl: "{{ url_for('main.api_direction') }}",
    completeUrl: "{{ url_for('main.session_complete') }}",
    mode: 'test'
  });
</script>
{% endblock %}
